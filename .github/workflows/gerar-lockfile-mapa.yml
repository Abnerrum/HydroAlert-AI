name: Gerar lockfile MapLibre (temporario)

on:
  push:
    branches: [fix/google-like-map-no-key-2026]
    paths:
      - frontend/package.json
      - .github/workflows/gerar-lockfile-mapa.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Versionar lockfile para manter npm ci deterministico
        run: |
          set -e
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile ja atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sincronizar lockfile MapLibre para builds reproduziveis"
          git push origin HEAD:fix/google-like-map-no-key-2026
