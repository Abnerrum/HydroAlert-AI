services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_dados:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t hydroalert/health -m ok >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: hydroalert_ai
    volumes:
      - mongo_dados:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  subscriber:
    build:
      context: https://github.com/Abnerrum/HydroAlert-AI.git#main
    command: python -m iot.mqtt_subscriber
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: hydroalert/telemetria
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DATABASE: hydroalert_ai
      MONGO_COLLECTION: telemetria
    volumes:
      - hydro_dados:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: https://github.com/Abnerrum/HydroAlert-AI.git#main
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DATABASE: hydroalert_ai
      MONGO_COLLECTION: telemetria
      CORS_ORIGINS: "*"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - hydro_dados:/app/data
      - hydro_models:/app/models
    depends_on:
      mongo:
        condition: service_healthy
      subscriber:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  publisher:
    build:
      context: https://github.com/Abnerrum/HydroAlert-AI.git#main
    command: python -m iot.mqtt_publisher --intervalo 30
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: hydroalert/telemetria
    depends_on:
      mosquitto:
        condition: service_healthy
      subscriber:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_dados:
  hydro_dados:
  hydro_models:
  mosquitto_dados:
