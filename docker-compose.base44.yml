services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hydroalert-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_dados:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t hydroalert/health -m ok >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: hydroalert-mongo
    environment:
      MONGO_INITDB_DATABASE: hydroalert_ai
    ports:
      - "27017:27017"
    volumes:
      - mongo_dados:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: hydroalert-api
    command: >
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DATABASE: hydroalert_ai
      MONGO_COLLECTION: telemetria
      MONGO_TIMEOUT_MS: 2000
      CORS_ORIGINS: "*"
      API_TOKEN: ""
      LOG_LEVEL: INFO
    volumes:
      - ./:/app
      - hydro_dados:/app/data
      - hydro_models:/app/models
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  web:
    image: node:22-slim
    container_name: hydroalert-web
    working_dir: /app/frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_PROXY=http://api:8000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./dashboard:/app/dashboard
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  subscriber:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: hydroalert-subscriber
    command: python -m iot.mqtt_subscriber
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_QOS: 1
      MQTT_TOPIC_PREFIX: hydroalert/telemetria
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DATABASE: hydroalert_ai
      MONGO_COLLECTION: telemetria
      MONGO_TIMEOUT_MS: 2000
      LOG_LEVEL: INFO
    volumes:
      - ./:/app
      - hydro_dados:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: hydroalert-publisher
    command: python -m iot.mqtt_publisher --intervalo 5
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_QOS: 1
      MQTT_TOPIC_PREFIX: hydroalert/telemetria
      LOG_LEVEL: INFO
    volumes:
      - ./:/app
      - hydro_dados:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy
      subscriber:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_dados:
  hydro_dados:
  hydro_models:
  mosquitto_dados:
  frontend_node_modules:
